name: probe-runners
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-13, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: List installed Xcodes
        run: |
          ls /Applications/ | grep -i "xcode" || echo "NO_XCODE_DIR"
      - name: Xcode version
        run: |
          xcodebuild -version 2>&1 || echo "NO_XCODEBUILD"
      - name: OS version
        run: sw_vers